<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLUCOSCAN - Contacto</title>
</head>
<body>

<header>
  <img src="assets/img/logo-glucoscan.png" alt="Logo GLUCOSCAN" width="120">
  <h1>GLUCOSCAN</h1>
  <nav>
    <a href="index.html">Inicio</a> |
    <a href="conocenos.html">Conócenos</a> |
    <a href="diabetes.html">La diabetes</a> |
    <a href="reservar.html">Reservar cita</a> |
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<main>
  <section>
    <h2>Contacto</h2>
    <p>¿Tienes dudas o comentarios? Escríbenos.</p>

    <form action="#" method="get">
      <fieldset>
        <legend>Escríbenos</legend>

        <label>Nombre:</label><br>
        <input type="text" name="nombre" placeholder="Escribe tu nombre" required><br><br>

        <label>Correo electrónico:</label><br>
        <input type="email" name="correo" placeholder="ejemplo@correo.com" required><br><br>

        <label>Mensaje:</label><br>
        <textarea name="mensaje" rows="5" cols="40" placeholder="Escribe tu mensaje aquí..." required></textarea><br><br>

        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label><br><br>
      </fieldset>

      <input type="reset" value="Reiniciar">
      <input type="submit" value="Enviar">
    </form>
  </section>
</main>

<footer>
  <p>GLUCOSCAN &mdash; Sistema de citas médicas para prevención y atención integral de la diabetes.</p>
</footer>

</body>
</html>
